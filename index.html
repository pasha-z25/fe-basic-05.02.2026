<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson template</title>
    <link rel="stylesheet" href="./fonts/fonts.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header></header>
    <main>
        <section>
            <div class="container">
                <h1>Lesson template</h1>
                <img src="./images/cat.jpg" alt="Cat" width="500">

                <form>
                    <fieldset>
                        <legend>Custom radio</legend>
                        <p>
                            <label class="custom-radio">
                                <input class="input" type="radio" name="radio" id="1">
                                <span class="radio"></span>
                                <span class="label">Option 1</span>
                            </label>
                        </p>
                        <p>
                            <label class="custom-radio">
                                <input class="input" type="radio" name="radio" id="2">
                                <span class="radio"></span>
                                <span class="label">Option 2</span>
                            </label>
                        </p>
                        <p>
                            <label class="custom-radio">
                                <input class="input" type="radio" name="radio" id="3">
                                <span class="radio"></span>
                                <span class="label">Option 3</span>
                            </label>
                        </p>
                    </fieldset>
                    <fieldset>
                        <legend>Custom checkbox</legend>
                        <p>
                            <label class="custom-checkbox">
                                <input class="input" type="checkbox" name="checkbox" id="option1">
                                <span class="checkbox"></span>
                                <span class="label">Option 1</span>
                            </label>
                        </p>

                        <p>
                            <label class="custom-checkbox2">
                                <input class="input" type="checkbox" name="checkbox" id="option2">
                                <span class="checkbox"></span>
                                <span class="label">Option 2</span>
                            </label>
                        </p>

                        <p>
                            <label class="custom-checkbox3">
                                <input class="input" type="checkbox" name="checkbox" id="option3">
                                <span class="checkbox"></span>
                                <span class="label">Option 3</span>
                            </label>
                        </p>
                    </fieldset>
                </form>

                <!-- <button id="loadBtn" type="button">Load</button> -->
            </div>
        </section>
    </main>
    <footer></footer>
    <div class="wrapper">
        <!-- <div class="preloader"></div> -->
        <div class="loader"></div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
</body>

</html>
